<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StarCraft Polymorphism Game Engine (Input - Update - Render)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
    background-color: #0b0e14;
    color: #e2e8f0;
    padding: 20px;
    line-height: 1.5;
  }
  .container { max-width: 1200px; margin: 0 auto; }
  header {
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid #1e293b; padding-bottom: 16px; margin-bottom: 20px;
    flex-wrap: wrap; gap: 12px;
  }
  h1 { font-size: 1.5rem; color: #38bdf8; }
  .badge { background: #1e293b; color: #94a3b8; padding: 4px 10px; border-radius: 6px; font-size: 0.85rem; }
  .btn-group { display: flex; gap: 10px; flex-wrap: wrap; }
  button {
    background: #2563eb; color: white; border: none; padding: 8px 14px;
    border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.9rem;
    transition: background 0.15s;
  }
  button:hover { background: #1d4ed8; }
  button.secondary { background: #334155; }
  button.secondary:hover { background: #475569; }
  button.danger { background: #dc2626; }
  button.danger:hover { background: #b91c1c; }
  button.success { background: #059669; }
  button.success:hover { background: #047857; }

  .grid-layout {
    display: grid; grid-template-columns: 1fr 380px; gap: 20px; margin-bottom: 24px;
  }
  @media (max-width: 900px) { .grid-layout { grid-template-columns: 1fr; } }

  .panel {
    background: #111827; border: 1px solid #1f2937; border-radius: 10px; padding: 16px;
  }
  .panel-title {
    font-size: 1rem; font-weight: 700; color: #f8fafc; margin-bottom: 12px;
    display: flex; justify-content: space-between; align-items: center;
  }
  canvas {
    width: 100%; background: #06090f; border: 1px solid #334155; border-radius: 8px; display: block;
  }
  .controls-bar {
    display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; align-items: center;
  }
  .unit-card {
    background: #1e293b; border: 2px solid transparent; border-radius: 8px;
    padding: 10px; margin-bottom: 8px; cursor: pointer; transition: 0.15s;
  }
  .unit-card.selected { border-color: #38bdf8; background: #172554; }
  .unit-header { display: flex; justify-content: space-between; font-weight: 700; font-size: 0.95rem; }
  .race-terran { color: #60a5fa; }
  .race-zerg { color: #c084fc; }
  .race-protoss { color: #facc15; }
  .bar-bg { background: #0f172a; height: 6px; border-radius: 3px; margin-top: 4px; overflow: hidden; }
  .bar-hp { background: #22c55e; height: 100%; }
  .bar-sh { background: #38bdf8; height: 100%; }
  .unit-meta { font-size: 0.8rem; color: #94a3b8; margin-top: 4px; }

  .log-box {
    background: #06090f; border: 1px solid #1f2937; border-radius: 6px;
    padding: 10px; height: 140px; overflow-y: auto; font-family: monospace; font-size: 0.85rem;
    color: #cbd5e1; margin-top: 12px;
  }
  .log-box div { margin-bottom: 4px; }

  pre {
    background: #06090f; border: 1px solid #1f2937; border-radius: 8px;
    padding: 16px; overflow-x: auto; font-size: 0.85rem; color: #e2e8f0;
    max-height: 450px;
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <div>
      <h1>StarCraft 다형성 게임 엔진 (Input → Update → Render)</h1>
      <span class="badge">추상클래스 Unit | 테란·저그·프로토스 | ICloakable · IDetector · ITransport · IWorker · IBurrowable</span>
    </div>
    <div class="btn-group">
      <button class="success" onclick="downloadProgramCs()">⬇ Program.cs 전체 다운로드</button>
      <button class="secondary" onclick="copyCode()">📋 코드 복사</button>
    </div>
  </header>

  <div class="grid-layout">
    <!-- 렌더링 & 입력 영역 -->
    <div class="panel">
      <div class="panel-title">
        <span>전장 렌더링 (60 FPS Loop)</span>
        <span id="loop-stats" class="badge">Tick: 0 | 선택: SCV</span>
      </div>
      <canvas id="gameCanvas" width="720" height="380"></canvas>
      <div class="controls-bar">
        <button class="secondary" onclick="handleAction('prev')">◀ 이전 유닛 (Q)</button>
        <button class="secondary" onclick="handleAction('next')">다음 유닛 (Tab/E) ▶</button>
        <button onclick="handleAction('ability')">⚡ 특수 능력 (Space)</button>
        <button class="danger" onclick="handleAction('damage')">💥 피격 테스트 -25 (H)</button>
        <span style="font-size:0.82rem; color:#94a3b8;">이동: WASD / 방향키 / 캔버스 클릭</span>
      </div>
      <div class="log-box" id="logBox"></div>
    </div>

    <!-- 유닛 상태 패널 -->
    <div class="panel">
      <div class="panel-title">
        <span>유닛 인스펙터 (다형성 상태)</span>
        <span class="badge">자동 재생: 1초/회</span>
      </div>
      <div id="unitList"></div>
    </div>
  </div>

  <!-- C# 전체 소스 코드 영역 -->
  <div class="panel">
    <div class="panel-title">
      <span>C# 콘솔 게임 루프 전체 코드 (Program.cs - 단일 파일 통합)</span>
      <button class="success" onclick="downloadProgramCs()">⬇ Program.cs 다운로드</button>
    </div>
    <pre><code id="csharpCode"></code></pre>
  </div>
</div>

<script>
const CSHARP_SOURCE = 'using System;\nusing System.Collections.Generic;\nusing System.Linq;\n\nnamespace StarCraftGameLoop\n{\n    public enum MoveType { Ground, Air }\n    public enum UnitAttribute { Biological, Mechanical }\n\n    // 5대 핵심 인터페이스\n    public interface ICloakable\n    {\n        bool IsCloaked { get; }\n        void ToggleCloak();\n    }\n\n    public interface IDetector\n    {\n        int DetectRange { get; }\n        void Scan(IEnumerable<Unit> units);\n    }\n\n    public interface ITransport\n    {\n        int Capacity { get; }\n        List<Unit> LoadedUnits { get; }\n        void Load(Unit target);\n        void UnloadAll();\n    }\n\n    public interface IWorker\n    {\n        int CarriedMinerals { get; }\n        void Gather();\n    }\n\n    public interface IBurrowable\n    {\n        bool IsBurrowed { get; }\n        void ToggleBurrow();\n    }\n\n    // 공통 기능을 갖는 추상 클래스\n    public abstract class Unit\n    {\n        public int Id { get; }\n        public string Name { get; protected set; }\n        public int MaxHp { get; protected set; }\n        public int CurrentHp { get; protected set; }\n        public MoveType MoveType { get; protected set; }\n        public UnitAttribute Attribute { get; protected set; }\n        public int X { get; protected set; }\n        public int Y { get; protected set; }\n        public char Symbol { get; protected set; }\n\n        public bool IsAlive => CurrentHp > 0;\n\n        protected Unit(int id, string name, int maxHp, MoveType moveType, UnitAttribute attribute, int x, int y, char symbol)\n        {\n            Id = id;\n            Name = name;\n            MaxHp = maxHp;\n            CurrentHp = maxHp;\n            MoveType = moveType;\n            Attribute = attribute;\n            X = x;\n            Y = y;\n            Symbol = symbol;\n        }\n\n        // 가상 이동 메서드 (잠복/은폐 등에 따라 다형적으로 오버라이드 가능)\n        public virtual string Move(int dx, int dy, int mapWidth, int mapHeight)\n        {\n            int nextX = Math.Clamp(X + dx, 0, mapWidth - 1);\n            int nextY = Math.Clamp(Y + dy, 0, mapHeight - 1);\n            X = nextX;\n            Y = nextY;\n            return $"[{Name}] ({X}, {Y}) 위치로 {MoveType} 이동.";\n        }\n\n        public virtual string TakeDamage(int damage)\n        {\n            CurrentHp = Math.Max(0, CurrentHp - damage);\n            return $"[{Name}] {damage} 피해! (HP: {CurrentHp}/{MaxHp})";\n        }\n\n        // 매 틱(Tick)마다 종족별 고유 패시브 갱신 (다형성 핵심)\n        public abstract string Update();\n\n        public virtual string GetStatusText()\n        {\n            return $"#{Id} {Name,-10} | HP:{CurrentHp,3}/{MaxHp,-3} | ({X,2},{Y}) | {MoveType}/{Attribute}";\n        }\n    }\n\n    // 1. 테란: 자동 재생 없음\n    public abstract class TerranUnit : Unit\n    {\n        protected TerranUnit(int id, string name, int maxHp, MoveType moveType, UnitAttribute attribute, int x, int y, char symbol)\n            : base(id, name, maxHp, moveType, attribute, x, y, symbol) { }\n\n        public override string Update()\n        {\n            return ""; // 테란은 자연 회복이 없음\n        }\n    }\n\n    // 2. 저그: 매 턴 체력 자동 재생\n    public abstract class ZergUnit : Unit\n    {\n        public int HpRegenRate { get; protected set; }\n\n        protected ZergUnit(int id, string name, int maxHp, int hpRegenRate, MoveType moveType, UnitAttribute attribute, int x, int y, char symbol)\n            : base(id, name, maxHp, moveType, attribute, x, y, symbol)\n        {\n            HpRegenRate = hpRegenRate;\n        }\n\n        public override string Update()\n        {\n            if (IsAlive && CurrentHp < MaxHp)\n            {\n                int before = CurrentHp;\n                CurrentHp = Math.Min(MaxHp, CurrentHp + HpRegenRate);\n                return $"[저그 재생] {Name} 체력 회복 (+{CurrentHp - before} -> {CurrentHp}/{MaxHp})";\n            }\n            return "";\n        }\n    }\n\n    // 3. 프로토스: 쉴드 선피해 + 매 턴 쉴드 자동 재생\n    public abstract class ProtossUnit : Unit\n    {\n        public int MaxShield { get; protected set; }\n        public int CurrentShield { get; protected set; }\n        public int ShieldRegenRate { get; protected set; }\n\n        protected ProtossUnit(int id, string name, int maxHp, int maxShield, int shieldRegenRate, MoveType moveType, UnitAttribute attribute, int x, int y, char symbol)\n            : base(id, name, maxHp, moveType, attribute, x, y, symbol)\n        {\n            MaxShield = maxShield;\n            CurrentShield = maxShield;\n            ShieldRegenRate = shieldRegenRate;\n        }\n\n        public override string TakeDamage(int damage)\n        {\n            int remaining = damage;\n            if (CurrentShield > 0)\n            {\n                int absorbed = Math.Min(CurrentShield, remaining);\n                CurrentShield -= absorbed;\n                remaining -= absorbed;\n            }\n            if (remaining > 0)\n            {\n                CurrentHp = Math.Max(0, CurrentHp - remaining);\n            }\n            return $"[{Name}] {damage} 피해! (Shield: {CurrentShield}/{MaxShield}, HP: {CurrentHp}/{MaxHp})";\n        }\n\n        public override string Update()\n        {\n            if (IsAlive && CurrentShield < MaxShield)\n            {\n                int before = CurrentShield;\n                CurrentShield = Math.Min(MaxShield, CurrentShield + ShieldRegenRate);\n                return $"[프로토스 재생] {Name} 쉴드 충전 (+{CurrentShield - before} -> {CurrentShield}/{MaxShield})";\n            }\n            return "";\n        }\n\n        public override string GetStatusText()\n        {\n            return $"#{Id} {Name,-10} | HP:{CurrentHp,3}/{MaxHp,-3} SH:{CurrentShield,3}/{MaxShield,-3} | ({X,2},{Y})";\n        }\n    }\n\n    // --- 구체 유닛 구현 (인터페이스 조합) ---\n\n    public class SCV : TerranUnit, IWorker\n    {\n        public int CarriedMinerals { get; private set; }\n        public SCV(int id, int x, int y)\n            : base(id, "SCV", 60, MoveType.Ground, UnitAttribute.Mechanical, x, y, \'S\') { }\n\n        public void Gather()\n        {\n            CarriedMinerals += 8;\n        }\n\n        public override string GetStatusText() => base.GetStatusText() + $" | 미네랄:{CarriedMinerals}";\n    }\n\n    public class Wraith : TerranUnit, ICloakable\n    {\n        public bool IsCloaked { get; private set; }\n        public Wraith(int id, int x, int y)\n            : base(id, "레이스", 120, MoveType.Air, UnitAttribute.Mechanical, x, y, \'W\') { }\n\n        public void ToggleCloak() => IsCloaked = !IsCloaked;\n\n        public override string GetStatusText() => base.GetStatusText() + (IsCloaked ? " [은폐중]" : "");\n    }\n\n    public class Dropship : TerranUnit, ITransport\n    {\n        public int Capacity => 4;\n        public List<Unit> LoadedUnits { get; } = new List<Unit>();\n        public Dropship(int id, int x, int y)\n            : base(id, "드랍쉽", 150, MoveType.Air, UnitAttribute.Mechanical, x, y, \'D\') { }\n\n        public void Load(Unit target)\n        {\n            if (target != this && target.MoveType == MoveType.Ground && LoadedUnits.Count < Capacity && !LoadedUnits.Contains(target))\n            {\n                LoadedUnits.Add(target);\n            }\n        }\n\n        public void UnloadAll() => LoadedUnits.Clear();\n\n        public override string GetStatusText() => base.GetStatusText() + $" | 탑승:{LoadedUnits.Count}/{Capacity}";\n    }\n\n    public class Zergling : ZergUnit, IBurrowable\n    {\n        public bool IsBurrowed { get; private set; }\n        public Zergling(int id, int x, int y)\n            : base(id, "저글링", 35, 2, MoveType.Ground, UnitAttribute.Biological, x, y, \'Z\') { }\n\n        public void ToggleBurrow() => IsBurrowed = !IsBurrowed;\n\n        public override string Move(int dx, int dy, int mapWidth, int mapHeight)\n        {\n            if (IsBurrowed) return $"[{Name}] 버로우 상태에서는 이동할 수 없습니다!";\n            return base.Move(dx, dy, mapWidth, mapHeight);\n        }\n\n        public override string GetStatusText() => base.GetStatusText() + (IsBurrowed ? " [잠복중]" : "");\n    }\n\n    public class Overlord : ZergUnit, IDetector, ITransport\n    {\n        public int DetectRange => 5;\n        public int Capacity => 4;\n        public List<Unit> LoadedUnits { get; } = new List<Unit>();\n\n        public Overlord(int id, int x, int y)\n            : base(id, "오버로드", 200, 3, MoveType.Air, UnitAttribute.Biological, x, y, \'O\') { }\n\n        public void Scan(IEnumerable<Unit> units) { }\n\n        public void Load(Unit target)\n        {\n            if (target != this && target.MoveType == MoveType.Ground && LoadedUnits.Count < Capacity && !LoadedUnits.Contains(target))\n            {\n                LoadedUnits.Add(target);\n            }\n        }\n\n        public void UnloadAll() => LoadedUnits.Clear();\n\n        public override string GetStatusText() => base.GetStatusText() + $" | 디텍터/탑승:{LoadedUnits.Count}";\n    }\n\n    public class Observer : ProtossUnit, ICloakable, IDetector\n    {\n        public bool IsCloaked { get; private set; } = true;\n        public int DetectRange => 6;\n\n        public Observer(int id, int x, int y)\n            : base(id, "옵저버", 40, 20, 3, MoveType.Air, UnitAttribute.Mechanical, x, y, \'B\') { }\n\n        public void ToggleCloak() => IsCloaked = !IsCloaked;\n        public void Scan(IEnumerable<Unit> units) { }\n\n        public override string GetStatusText() => base.GetStatusText() + (IsCloaked ? " [영구은폐/디텍터]" : " [디텍터]");\n    }\n\n    // --- 입력(Input) - 갱신(Update) - 렌더링(Render) 게임 엔진 ---\n    public class GameEngine\n    {\n        private const int MapWidth = 20;\n        private const int MapHeight = 10;\n        private readonly List<Unit> _units = new List<Unit>();\n        private readonly Queue<string> _logs = new Queue<string>();\n        private int _selectedIndex = 0;\n        private int _turn = 1;\n        private bool _isRunning = true;\n\n        public void Initialize()\n        {\n            _units.Add(new SCV(1, 2, 2));\n            _units.Add(new Wraith(2, 5, 1));\n            _units.Add(new Dropship(3, 4, 3));\n            _units.Add(new Zergling(4, 12, 6));\n            _units.Add(new Overlord(5, 14, 5));\n            _units.Add(new Observer(6, 17, 2));\n            AddLog("전장 초기화 완료! [Tab] 유닛 선택, [WASD] 이동, [Space] 특수능력");\n        }\n\n        public void Run()\n        {\n            Initialize();\n            while (_isRunning)\n            {\n                Render();           // 1. 렌더링 (Rendering)\n                ConsoleKey key = ProcessInput(); // 2. 입력 (Input)\n                if (!_isRunning) break;\n                Update(key);        // 3. 갱신 (Update)\n            }\n        }\n\n        // [입력 단계] 사용자 키 입력 수집\n        private ConsoleKey ProcessInput()\n        {\n            Console.Write("\\n명령 입력 > ");\n            return Console.ReadKey(true).Key;\n        }\n\n        // [갱신 단계] 다형성을 활용한 상태 업데이트 및 턴 진행\n        private void Update(ConsoleKey key)\n        {\n            Unit selected = _units[_selectedIndex];\n            bool advanceTurn = true;\n\n            switch (key)\n            {\n                case ConsoleKey.Q:\n                    _isRunning = false;\n                    return;\n\n                case ConsoleKey.Tab:\n                    _selectedIndex = (_selectedIndex + 1) % _units.Count;\n                    AddLog($"유닛 선택 변경 -> {_units[_selectedIndex].Name}");\n                    advanceTurn = false;\n                    break;\n\n                case ConsoleKey.W: AddLog(selected.Move(0, -1, MapWidth, MapHeight)); break;\n                case ConsoleKey.S: AddLog(selected.Move(0, 1, MapWidth, MapHeight)); break;\n                case ConsoleKey.A: AddLog(selected.Move(-1, 0, MapWidth, MapHeight)); break;\n                case ConsoleKey.D: AddLog(selected.Move(1, 0, MapWidth, MapHeight)); break;\n\n                case ConsoleKey.H: // 테스트 피격 (30 데미지)\n                    AddLog(selected.TakeDamage(30));\n                    break;\n\n                case ConsoleKey.Spacebar: // 인터페이스 기반 다형성 스킬 발동\n                    ExecuteSpecialAbility(selected);\n                    break;\n\n                case ConsoleKey.Enter: // 대기 (턴 넘김)\n                    AddLog($"[{selected.Name}] 대기하며 턴을 넘깁니다.");\n                    break;\n\n                default:\n                    advanceTurn = false;\n                    break;\n            }\n\n            if (advanceTurn)\n            {\n                _turn++;\n                // 모든 유닛의 종족별 패시브(저그 체력재생, 프로토스 쉴드재생) 다형성 갱신\n                foreach (var unit in _units)\n                {\n                    string regenMsg = unit.Update();\n                    if (!string.IsNullOrEmpty(regenMsg))\n                    {\n                        AddLog(regenMsg);\n                    }\n                }\n            }\n        }\n\n        private void ExecuteSpecialAbility(Unit unit)\n        {\n            bool acted = false;\n            if (unit is IWorker worker)\n            {\n                worker.Gather();\n                AddLog($"[IWorker] {unit.Name} 미네랄 채취! (보유: {worker.CarriedMinerals})");\n                acted = true;\n            }\n            if (unit is ICloakable cloakable)\n            {\n                cloakable.ToggleCloak();\n                AddLog($"[ICloakable] {unit.Name} 은폐 상태 전환 -> {cloakable.IsCloaked}");\n                acted = true;\n            }\n            if (unit is IBurrowable burrowable)\n            {\n                burrowable.ToggleBurrow();\n                AddLog($"[IBurrowable] {unit.Name} 잠복 상태 전환 -> {burrowable.IsBurrowed}");\n                acted = true;\n            }\n            if (unit is IDetector detector)\n            {\n                var cloakedTargets = _units.OfType<ICloakable>()\n                    .Where(c => c.IsCloaked && c is Unit u && Math.Abs(u.X - unit.X) + Math.Abs(u.Y - unit.Y) <= detector.DetectRange)\n                    .Cast<Unit>()\n                    .Select(u => u.Name)\n                    .ToList();\n                string found = cloakedTargets.Count > 0 ? string.Join(", ", cloakedTargets) : "없음";\n                AddLog($"[IDetector] {unit.Name} 범위({detector.DetectRange}) 탐지 결과: {found}");\n                acted = true;\n            }\n            if (unit is ITransport transport)\n            {\n                if (transport.LoadedUnits.Count > 0)\n                {\n                    transport.UnloadAll();\n                    AddLog($"[ITransport] {unit.Name} 모든 탑승 유닛 하차 완료!");\n                }\n                else\n                {\n                    var nearbyGround = _units.FirstOrDefault(u => u != unit && u.MoveType == MoveType.Ground && Math.Abs(u.X - unit.X) <= 2 && Math.Abs(u.Y - unit.Y) <= 2);\n                    if (nearbyGround != null)\n                    {\n                        transport.Load(nearbyGround);\n                        AddLog($"[ITransport] {unit.Name}에 {nearbyGround.Name} 탑승 완료!");\n                    }\n                    else\n                    {\n                        AddLog($"[ITransport] 주변(2칸 이내)에 탑승할 지상 유닛이 없습니다.");\n                    }\n                }\n                acted = true;\n            }\n\n            if (!acted) AddLog($"[{unit.Name}] 사용 가능한 특수 능력이 없습니다.");\n        }\n\n        // [렌더링 단계] 맵, 유닛 목록, 조작키, 전투 로그 출력\n        private void Render()\n        {\n            Console.Clear();\n            Console.WriteLine($"=== STARCRAFT POLYMORPHISM ENGINE | TURN: {_turn} ===");\n            Console.WriteLine("조작: [Tab]유닛변경 | [WASD]이동 | [Space]특수능력 | [H]피격테스트(-30) | [Enter]턴넘김 | [Q]종료\\n");\n\n            // 2D 그리드 맵 렌더링\n            char[,] grid = new char[MapHeight, MapWidth];\n            for (int y = 0; y < MapHeight; y++)\n                for (int x = 0; x < MapWidth; x++)\n                    grid[y, x] = \'.\';\n\n            for (int i = 0; i < _units.Count; i++)\n            {\n                Unit u = _units[i];\n                if (u.IsAlive)\n                {\n                    grid[u.Y, u.X] = (i == _selectedIndex) ? char.ToUpper(u.Symbol) : char.ToLower(u.Symbol);\n                }\n            }\n\n            Console.WriteLine("+" + new string(\'-\', MapWidth * 2 + 1) + "+");\n            for (int y = 0; y < MapHeight; y++)\n            {\n                Console.Write("| ");\n                for (int x = 0; x < MapWidth; x++)\n                {\n                    Console.Write(grid[y, x] + " ");\n                }\n                Console.WriteLine("|");\n            }\n            Console.WriteLine("+" + new string(\'-\', MapWidth * 2 + 1) + "+");\n\n            // 유닛 상태창 렌더링\n            Console.WriteLine("\\n[유닛 상태 목록] (* 현재 선택됨)");\n            for (int i = 0; i < _units.Count; i++)\n            {\n                string prefix = (i == _selectedIndex) ? " * " : "   ";\n                Console.WriteLine(prefix + _units[i].GetStatusText());\n            }\n\n            // 이벤트 로그 렌더링\n            Console.WriteLine("\\n[전투 및 시스템 로그]");\n            foreach (var log in _logs)\n            {\n                Console.WriteLine(" > " + log);\n            }\n        }\n\n        private void AddLog(string msg)\n        {\n            if (string.IsNullOrWhiteSpace(msg)) return;\n            _logs.Enqueue($"[T{_turn}] {msg}");\n            if (_logs.Count > 5) _logs.Dequeue();\n        }\n    }\n\n    public class Program\n    {\n        public static void Main(string[] args)\n        {\n            Console.OutputEncoding = System.Text.Encoding.UTF8;\n            GameEngine engine = new GameEngine();\n            engine.Run();\n        }\n    }\n}\n';
document.getElementById('csharpCode').textContent = CSHARP_SOURCE;

function downloadProgramCs() {
  const blob = new Blob([CSHARP_SOURCE], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'Program.cs';
  a.click();
  URL.revokeObjectURL(url);
}

function copyCode() {
  navigator.clipboard.writeText(CSHARP_SOURCE);
  addLog('시스템: Program.cs 코드가 클립보드에 복사되었습니다.');
}

// --- 웹 브라우저 라이브 게임 루프 (Input -> Update -> Render) ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const logBox = document.getElementById('logBox');
const unitListEl = document.getElementById('unitList');

function addLog(text) {
  const div = document.createElement('div');
  div.textContent = `[${new Date().toLocaleTimeString()}] ${text}`;
  logBox.prepend(div);
  if (logBox.children.length > 30) logBox.removeChild(logBox.lastChild);
}

// 추상 클래스 개념을 반영한 JS 클래스 계층
class Unit {
  constructor(id, name, race, maxHp, moveType, attr, x, y, color) {
    this.id = id; this.name = name; this.race = race;
    this.maxHp = maxHp; this.hp = maxHp;
    this.moveType = moveType; this.attr = attr;
    this.x = x; this.y = y; this.targetX = x; this.targetY = y;
    this.color = color; this.speed = 3.2;
    this.detectedTimer = 0;
  }
  moveTo(tx, ty) {
    this.targetX = Math.max(24, Math.min(canvas.width - 24, tx));
    this.targetY = Math.max(24, Math.min(canvas.height - 24, ty));
  }
  takeDamage(dmg) {
    this.hp = Math.max(0, this.hp - dmg);
    addLog(`[피격] ${this.name} 체력 -${dmg} (HP: ${this.hp}/${this.maxHp})`);
  }
  update(dt) {
    const dx = this.targetX - this.x;
    const dy = this.targetY - this.y;
    const dist = Math.hypot(dx, dy);
    if (dist > 2) {
      this.x += (dx / dist) * this.speed;
      this.y += (dy / dist) * this.speed;
    }
    if (this.detectedTimer > 0) this.detectedTimer -= dt;
  }
  onRegenTick() {}
}

class TerranUnit extends Unit {
  constructor(id, name, maxHp, moveType, attr, x, y) {
    super(id, name, 'Terran', maxHp, moveType, attr, x, y, '#3b82f6');
  }
}

class ZergUnit extends Unit {
  constructor(id, name, maxHp, regen, moveType, attr, x, y) {
    super(id, name, 'Zerg', maxHp, moveType, attr, x, y, '#a855f7');
    this.regen = regen;
  }
  onRegenTick() {
    if (this.hp > 0 && this.hp < this.maxHp) {
      this.hp = Math.min(this.maxHp, this.hp + this.regen);
    }
  }
}

class ProtossUnit extends Unit {
  constructor(id, name, maxHp, maxShield, regen, moveType, attr, x, y) {
    super(id, name, 'Protoss', maxHp, moveType, attr, x, y, '#eab308');
    this.maxShield = maxShield; this.shield = maxShield; this.shieldRegen = regen;
  }
  takeDamage(dmg) {
    let rem = dmg;
    if (this.shield > 0) {
      const abs = Math.min(this.shield, rem);
      this.shield -= abs; rem -= abs;
    }
    if (rem > 0) this.hp = Math.max(0, this.hp - rem);
    addLog(`[피격] ${this.name} -${dmg} (SH: ${this.shield}/${this.maxShield}, HP: ${this.hp}/${this.maxHp})`);
  }
  onRegenTick() {
    if (this.shield < this.maxShield) {
      this.shield = Math.min(this.maxShield, this.shield + this.shieldRegen);
    }
  }
}

class SCV extends TerranUnit {
  constructor(id, x, y) { super(id, 'SCV', 60, '지상', '기계', x, y); this.minerals = 0; }
  useAbility() { this.minerals += 8; addLog(`[IWorker] SCV 미네랄 채취! (+8 -> 총 ${this.minerals})`); }
  getExtra() { return `IWorker | 미네랄: ${this.minerals}`; }
}

class Wraith extends TerranUnit {
  constructor(id, x, y) { super(id, '레이스', 120, '공중', '기계', x, y); this.cloaked = false; }
  useAbility() { this.cloaked = !this.cloaked; addLog(`[ICloakable] 레이스 은폐: ${this.cloaked ? 'ON' : 'OFF'}`); }
  getExtra() { return `ICloakable | ${this.cloaked ? '은폐 활성' : '일반 상태'}`; }
}

class Zergling extends ZergUnit {
  constructor(id, x, y) { super(id, '저글링', 35, 2, '지상', '생체', x, y); this.burrowed = false; }
  moveTo(tx, ty) {
    if (this.burrowed) { addLog(`[경고] 저글링은 잠복(Burrow) 중 이동 불가!`); return; }
    super.moveTo(tx, ty);
  }
  useAbility() {
    this.burrowed = !this.burrowed;
    if (this.burrowed) { this.targetX = this.x; this.targetY = this.y; }
    addLog(`[IBurrowable] 저글링 잠복: ${this.burrowed ? '잠복(이동불가)' : '해제'}`);
  }
  getExtra() { return `IBurrowable | 체력재생(+2/s) | ${this.burrowed ? '잠복중' : '지상'}`; }
}

class Overlord extends ZergUnit {
  constructor(id, x, y) { super(id, '오버로드', 200, 3, '공중', '생체', x, y); this.cargo = []; }
  useAbility(allUnits) {
    if (this.cargo.length > 0) {
      this.cargo.forEach(u => { u.x = this.x + 20; u.y = this.y + 20; u.targetX = u.x; u.targetY = u.y; u.loaded = false; });
      addLog(`[ITransport] 오버로드 수송 유닛 ${this.cargo.length}기 하차!`);
      this.cargo = [];
    } else {
      const target = allUnits.find(u => u !== this && !u.loaded && u.moveType === '지상' && Math.hypot(u.x - this.x, u.y - this.y) < 75);
      if (target) {
        target.loaded = true; this.cargo.push(target);
        addLog(`[ITransport] 오버로드에 ${target.name} 탑승 완료!`);
      } else {
        addLog(`[IDetector/ITransport] 주변 75px 내 탑승할 지상 유닛 없음 (디텍터 상시 가동)`);
      }
    }
  }
  getExtra() { return `IDetector · ITransport | 탑승: ${this.cargo.length}/4`; }
}

class Observer extends ProtossUnit {
  constructor(id, x, y) { super(id, '옵저버', 40, 20, 3, '공중', '기계', x, y); this.cloaked = true; }
  useAbility(allUnits) {
    let found = [];
    allUnits.forEach(u => {
      if (u !== this && u.cloaked && Math.hypot(u.x - this.x, u.y - this.y) <= 130) {
        u.detectedTimer = 3.0;
        found.push(u.name);
      }
    });
    addLog(`[IDetector] 옵저버 광역 스캔: ${found.length ? found.join(', ') + ' 탐지됨!' : '은폐 유닛 없음'}`);
  }
  getExtra() { return `ICloakable(영구) · IDetector | 쉴드재생(+3/s)`; }
}

const units = [
  new SCV(1, 110, 120),
  new Wraith(2, 180, 80),
  new Zergling(3, 350, 240),
  new Overlord(4, 410, 180),
  new Observer(5, 580, 140)
];

let selectedIdx = 0;
let keys = {};
let tickCount = 0;
let regenAccum = 0;

// 1. INPUT (입력 처리)
window.addEventListener('keydown', (e) => {
  if (['Tab', 'Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  keys[e.code] = true;
  if (e.code === 'Tab' || e.code === 'KeyE') handleAction('next');
  if (e.code === 'KeyQ') handleAction('prev');
  if (e.code === 'Space') handleAction('ability');
  if (e.code === 'KeyH') handleAction('damage');
});
window.addEventListener('keyup', (e) => { keys[e.code] = false; });

canvas.addEventListener('mousedown', (e) => {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const mx = (e.clientX - rect.left) * scaleX;
  const my = (e.clientY - rect.top) * scaleY;

  const clickedIdx = units.findIndex(u => !u.loaded && Math.hypot(u.x - mx, u.y - my) < 22);
  if (clickedIdx !== -1) {
    selectedIdx = clickedIdx;
    addLog(`선택 변경: ${units[selectedIdx].name}`);
  } else {
    const u = units[selectedIdx];
    if (!u.loaded) u.moveTo(mx, my);
  }
});

function handleAction(type) {
  if (type === 'next') selectedIdx = (selectedIdx + 1) % units.length;
  if (type === 'prev') selectedIdx = (selectedIdx - 1 + units.length) % units.length;
  const u = units[selectedIdx];
  if (type === 'ability') u.useAbility(units);
  if (type === 'damage') u.takeDamage(25);
  renderUnitCards();
}

// 2. UPDATE (상태 갱신)
function update(dt) {
  tickCount++;
  const u = units[selectedIdx];
  if (u && !u.loaded) {
    let vx = 0, vy = 0;
    if (keys['KeyW'] || keys['ArrowUp']) vy -= 1;
    if (keys['KeyS'] || keys['ArrowDown']) vy += 1;
    if (keys['KeyA'] || keys['ArrowLeft']) vx -= 1;
    if (keys['KeyD'] || keys['ArrowRight']) vx += 1;
    if (vx !== 0 || vy !== 0) {
      u.moveTo(u.x + vx * 12, u.y + vy * 12);
    }
  }

  units.forEach(unit => {
    if (!unit.loaded) unit.update(dt);
  });

  // 1초마다 종족별 패시브(저그 체력 재생, 프로토스 쉴드 재생) 실행
  regenAccum += dt;
  if (regenAccum >= 1.0) {
    regenAccum = 0;
    units.forEach(unit => unit.onRegenTick());
    renderUnitCards();
  }
}

// 3. RENDER (화면 그리기)
function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // 그리드 배경
  ctx.strokeStyle = '#131c2e';
  ctx.lineWidth = 1;
  for (let x = 0; x < canvas.width; x += 40) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
  }
  for (let y = 0; y < canvas.height; y += 40) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
  }

  units.forEach((u, idx) => {
    if (u.loaded) return;

    // 디텍터 감지 범위 표시
    if (u instanceof Overlord || u instanceof Observer) {
      ctx.beginPath();
      ctx.arc(u.x, u.y, 130, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(56, 189, 248, 0.14)';
      ctx.stroke();
    }

    // 이동 목표선
    if (Math.hypot(u.targetX - u.x, u.targetY - u.y) > 4) {
      ctx.beginPath();
      ctx.moveTo(u.x, u.y); ctx.lineTo(u.targetX, u.targetY);
      ctx.strokeStyle = 'rgba(34, 197, 94, 0.5)';
      ctx.setLineDash([4, 4]); ctx.stroke(); ctx.setLineDash([]);
    }

    // 선택 링
    if (idx === selectedIdx) {
      ctx.beginPath();
      ctx.arc(u.x, u.y, 22, 0, Math.PI * 2);
      ctx.strokeStyle = '#22c55e';
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    // 은폐 / 잠복 반투명 처리
    ctx.save();
    if (u.cloaked || u.burrowed) ctx.globalAlpha = 0.42;

    // 유닛 본체
    ctx.beginPath();
    ctx.arc(u.x, u.y, 15, 0, Math.PI * 2);
    ctx.fillStyle = u.color;
    ctx.fill();
    ctx.strokeStyle = '#f8fafc';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // 공중 유닛 표시
    if (u.moveType === '공중') {
      ctx.beginPath();
      ctx.arc(u.x, u.y, 18, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(255,255,255,0.35)';
      ctx.stroke();
    }
    ctx.restore();

    // 디텍팅 감지 표시
    if (u.detectedTimer > 0) {
      ctx.fillStyle = '#f43f5e';
      ctx.font = 'bold 11px sans-serif';
      ctx.fillText('👁 DETECTED', u.x - 30, u.y - 26);
    }

    // 이름 및 체력바
    ctx.fillStyle = '#f1f5f9';
    ctx.font = '12px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(u.name, u.x, u.y + 30);

    const barW = 34;
    ctx.fillStyle = '#1e293b';
    ctx.fillRect(u.x - barW/2, u.y - 24, barW, 4);
    ctx.fillStyle = '#22c55e';
    ctx.fillRect(u.x - barW/2, u.y - 24, barW * (u.hp / u.maxHp), 4);
    if (u.maxShield) {
      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(u.x - barW/2, u.y - 29, barW * (u.shield / u.maxShield), 4);
    }
  });

  document.getElementById('loop-stats').textContent = `Tick: ${tickCount} | 선택: ${units[selectedIdx].name}`;
}

function renderUnitCards() {
  unitListEl.innerHTML = units.map((u, idx) => {
    const raceClass = u.race === 'Terran' ? 'race-terran' : u.race === 'Zerg' ? 'race-zerg' : 'race-protoss';
    const hpPct = Math.round((u.hp / u.maxHp) * 100);
    const shHtml = u.maxShield ? `
      <div class="bar-bg"><div class="bar-sh" style="width:${Math.round((u.shield/u.maxShield)*100)}%"></div></div>
    ` : '';
    return `
      <div class="unit-card ${idx === selectedIdx ? 'selected' : ''}" onclick="selectedIdx=${idx}; renderUnitCards();">
        <div class="unit-header">
          <span class="${raceClass}">${u.name} (${u.race})</span>
          <span>HP ${u.hp}/${u.maxHp} ${u.maxShield ? `| SH ${u.shield}/${u.maxShield}` : ''}</span>
        </div>
        ${shHtml}
        <div class="bar-bg"><div class="bar-hp" style="width:${hpPct}%"></div></div>
        <div class="unit-meta">${u.moveType} · ${u.attr} | ${u.getExtra()} ${u.loaded ? '[수송선 탑승중]' : ''}</div>
      </div>
    `;
  }).join('');
}

let lastTime = performance.now();
function gameLoop(now) {
  const dt = (now - lastTime) / 1000;
  lastTime = now;
  update(dt);
  render();
  requestAnimationFrame(gameLoop);
}

addLog('게임 엔진 시작! (Input -> Update -> Render 루프 가동)');
renderUnitCards();
requestAnimationFrame(gameLoop);
</script>
